services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
